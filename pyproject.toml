[project]
name = "veltrix-peopleops"
version = "0.1.0"
description = "Veltrix PeopleOps Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.153.0",
    "google-genai>=2.31.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "markdown-it-py>=4.2.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.1.6",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]


